problem:
  type: cantilever
  plane_condition: plane_stress

geometry:
  length: 1.0
  height: 1.0

material:
  youngs_modulus: 1.0
  poisson_ratio: 0.3

network:
  hidden_layers: [48, 48, 48]
  activation: tanh

sampling:
  n_interior: 2000
  n_boundary: 400
  method: lhs
  seed: 11

adaptive_sampling:
  enabled: false

scaling:
  enabled: true
  displacement_ref: 0.01

boundary:
  left: fixed
  right_traction_x: 0.0
  right_traction_y: 0.0
  right_traction_profile: uniform
  top: traction_free
  bottom: traction_free
  enforcement: soft

body_force:
  fx: 0.0
  fy: 0.0

loss:
  lambda_pde: 1.0
  lambda_bc: 10.0
  lambda_data: 50.0
  lambda_dirichlet: 10.0
  lambda_neumann: 1.0

training:
  adam_epochs: 2500
  adam_lr: 0.001
  lbfgs_enabled: true
  lbfgs_max_iter: 150
  scheduler: cosine
  grad_clip: 1.0
  log_every: 500
  checkpoint_every: 1000
  device: cpu
  seed: 11

reference:
  type: none

inverse:
  enabled: true
  learn_E: true
  learn_nu: false
  E_init: 0.4
  nu_init: 0.3
  noise_std: 0.01
  n_measurements: 60

logging:
  backend: none
  experiment_name: pinn-manufactured-inverse
  run_name: manufactured_inverse
  output_dir: outputs
